name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Paper2Paper
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate paper workspaces
        run: |
          paper2paper validate workspaces/spp1-tam-jitc
          paper2paper validate workspaces/bmc-cancer-2025-gastric-nerve-model

      - name: Check dependency impact
        run: |
          paper2paper impact workspaces/spp1-tam-jitc PAPER-SPP1-001
          paper2paper impact workspaces/bmc-cancer-2025-gastric-nerve-model PAPER-NRRS-001

      - name: Check execution priorities
        run: |
          paper2paper priorities workspaces/spp1-tam-jitc
          paper2paper priorities workspaces/bmc-cancer-2025-gastric-nerve-model
