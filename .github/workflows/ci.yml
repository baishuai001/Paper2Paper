name: validate

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: paper2paper validate pilots/spp1-tam-jitc
      - run: paper2paper validate pilots/gastric-nrrs
      - run: paper2paper validate-registry .
      - run: paper2paper coverage .

  gastric-nrrs-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r pilots/gastric-nrrs/code/requirements-gse62254.txt
      - run: python -m unittest pilots/gastric-nrrs/code/test_gse62254_nrrs_spike.py -v
