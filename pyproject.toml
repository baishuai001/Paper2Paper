[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2paper-workflow"
version = "0.5.0a2"
description = "Beginner-oriented, evidence-gated workflow from real anchor papers to manuscript projects"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Paper2Paper contributors" }]
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
paper2paper = "paper2paper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
