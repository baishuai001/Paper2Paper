[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2paper-workflow"
version = "0.3.0a1"
description = "Execution-first workflow for reproducible paper adaptation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Paper2Paper contributors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only"
]

[project.scripts]
paper2paper = "paper2paper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper2paper = ["data/*.json"]
